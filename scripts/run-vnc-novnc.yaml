# Default NERSC-oriented configuration for scripts/run-vnc-novnc.py.
# Values in strings are expanded from the host environment at runtime.

userns: keep-id
keep_groups: true
pull_policy: missing
slurm: false

volume:
  - "/global:/global"
  - "${SCRATCH}:${SCRATCH}:rw"
  - "${CFS}:${CFS}:rw"
  - "/opt:/opt"
  - "/etc/environment:/etc/environment:ro"

env:
  - "HOME"
  - "MODULEPATH"
  - "MODULEPATH_ROOT"
  - "MODULESHOME"
