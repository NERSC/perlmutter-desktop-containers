name: Build VNC/noVNC images

on:
  push:
    branches: [ main ]
    tags: [ '**' ]

  pull_request: {}

  release:
    types: [ published ]

  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nersc/perlmutter-desktop-containers

jobs:
  select_images:
    name: Select affected images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}

    steps:
      - name: Check out repository and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select images
        id: select
        run: python3 .github/scripts/select-images.py

  build_and_push_images:
    name: Build and push ${{ matrix.name }}
    needs: select_images
    if: needs.select_images.outputs.count != '0'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_images.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.main_tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.cache_scope == 'debian-12-fvwm3' }}
            type=raw,value=opensuse15.6-xfce-slurm-unix,enable=${{ github.ref == 'refs/heads/main' && matrix.cache_scope == 'opensuse-15.6-xfce-slurm' }}
            type=raw,value=${{ matrix.cache_scope }}-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.ci_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Smoke test image
        env:
          IMAGE_TAG: ${{ matrix.ci_tag }}
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE_TAG}" -lc '
            set -eu
            python3 -c "import vnc_novnc"
            test -x /usr/local/bin/vnc-novnc-entrypoint
            test -x /usr/local/bin/vnc-novnc-jupyter-kernel
            test -x /usr/local/bin/sshproxy
            command -v chromium
            command -v curl
            command -v dbus-launch
            command -v dbus-run-session
            command -v fc-match
            command -v gcc
            command -v gdb
            command -v git
            command -v ip
            command -v make
            command -v nmap
            command -v showmount
            command -v thunar
            command -v tcpdump
            command -v tshark
            command -v vim
            command -v vncpasswd
            command -v vncserver
            command -v websockify
            command -v wget
            test -n "${VNC_DESKTOP_CMD}"
            command -v "${VNC_DESKTOP_CMD}"
            test "$(getent passwd root | cut -d: -f7)" = "/bin/bash"
            test "${SHELL}" = "/bin/bash"
            test -s /etc/fonts/fonts.conf
            fc-match sans
            if command -v scli >/dev/null 2>&1; then
              test -x /usr/local/bin/scli
              test -x /usr/local/bin/ssh-proxy
              test "$(readlink /usr/local/bin/ssh)" = "/usr/local/bin/ssh-proxy"
              for command in srun sbatch salloc scontrol sacct squeue scancel sinfo sshare sprio; do
                test "$(readlink /usr/local/bin/${command})" = "/usr/local/bin/scli"
              done
            fi
            test ! -e /opt/vnc-novnc
          '

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
