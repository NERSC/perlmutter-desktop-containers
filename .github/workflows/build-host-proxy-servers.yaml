name: Build host proxy servers

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/build-host-proxy-servers.yaml
      - container/slurm-cli-proxy/**
      - scripts/install-jupyter-kernel.sh

  pull_request:
    paths:
      - .github/workflows/build-host-proxy-servers.yaml
      - container/slurm-cli-proxy/**
      - scripts/install-jupyter-kernel.sh

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Linux host binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: container/slurm-cli-proxy/go.sum

      - name: Build host proxy servers
        working-directory: container/slurm-cli-proxy
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "${RUNNER_TEMP}/scli-server" ./cmd/scli-server
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "${RUNNER_TEMP}/ssh-proxy-server" ./cmd/ssh-proxy-server
          test -x "${RUNNER_TEMP}/scli-server"
          test -x "${RUNNER_TEMP}/ssh-proxy-server"
          file "${RUNNER_TEMP}/scli-server" "${RUNNER_TEMP}/ssh-proxy-server"
          (cd "${RUNNER_TEMP}" && sha256sum scli-server ssh-proxy-server > SHA256SUMS)

      - name: Upload host proxy test binaries
        uses: actions/upload-artifact@v7
        with:
          name: host-proxies-linux-amd64
          path: |
            ${{ runner.temp }}/scli-server
            ${{ runner.temp }}/ssh-proxy-server
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

      - name: Build host proxy package
        run: |
          docker build \
            -f container/slurm-cli-proxy/host-binaries.Dockerfile \
            -t host-proxies:test \
            "${RUNNER_TEMP}"

      - name: Verify packaged binaries
        run: |
          container_id="$(docker create host-proxies:test)"
          trap 'docker rm -f "${container_id}" >/dev/null' EXIT
          mkdir -p "${RUNNER_TEMP}/package-check"
          docker cp "${container_id}:/usr/local/bin/." "${RUNNER_TEMP}/package-check"
          (cd "${RUNNER_TEMP}/package-check" && sha256sum -c SHA256SUMS)

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish host proxy package
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/nersc/perlmutter-desktop-containers
          docker tag host-proxies:test "${image}:host-proxies-linux-amd64"
          docker tag host-proxies:test "${image}:host-proxies-linux-amd64-${GITHUB_SHA}"
          docker push "${image}:host-proxies-linux-amd64-${GITHUB_SHA}"
          docker push "${image}:host-proxies-linux-amd64"
